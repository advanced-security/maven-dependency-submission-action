name: Publish Executables

permissions:
  contents: read

on:
  workflow_dispatch:
  push:

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build executables
        run: |
          npm run build
          npm exec -- pkg package.json --compress Gzip

      - name: Attach artifacts
        uses: actions/upload-artifact@v7
        with:
          name: executables
          path: cli/*