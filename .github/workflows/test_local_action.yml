name: Test Local Action

permissions:
  contents: write

on:
  push:
    paths:
      - action.yml
      - dist/**
      - src/**
      - test-data/maven/simple/**
      - .github/workflows/test_local_action.yml
  workflow_dispatch:
    inputs:
      directory:
        type: string
        default: test-data/maven/simple
        required: true

jobs:
  test:
    name: Test

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run local Action
        uses: ./
        with:
          directory: ${{ inputs.directory }}

  test_with_arguments:
    name: Test with Arguments

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run local Action
        uses: ./
        with:
          directory: ${{ inputs.directory }}
          maven-args: ' -X -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'